[project]
name = "regenai"
version = "0.1.0"
description = "Crawl, cluster, and summarize project directories using local AI"
requires-python = ">=3.11"
dependencies = [
    # Document parsing
    "unstructured[local-inference]",
    "pdfplumber",

    # Code parsing
    "tree-sitter",
    "tree-sitter-languages",

    # Embeddings & vector storage
    "sentence-transformers",
    "chromadb",
    "torch",

    # Clustering
    "umap-learn",
    "hdbscan",
    "scikit-learn",

    # LLM
    "ollama",

    # Utilities
    "pathspec",
    "rich",
    "chardet",
]

[project.scripts]
regenai = "regenai.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regenai"]

[tool.uv]
# Pin torch to CUDA 12.1 build for GPU acceleration.
# Users without NVIDIA GPU: remove this section and torch will default to CPU.
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
